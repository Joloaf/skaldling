services:
  postgres:
    image: postgres:17
    container_name: skaldling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skaldling_dev
      POSTGRES_USER: skaldling
      POSTGRES_PASSWORD: skaldling_dev_password
    ports:
      - "5433:5432"
    volumes:
      - skaldling_postgres_data:/var/lib/postgresql/data

volumes:
  skaldling_postgres_data:
